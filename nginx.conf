server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le fichier de config runtime ne doit jamais être mis en cache : il peut
    # être remplacé (volume monté) sans rebuild de l'image.
    location /assets/config/ {
        add_header Cache-Control "no-cache";
    }

    # index.html référence les bundles JS/CSS par nom hashé : s'il est mis en cache par le
    # navigateur, un redéploiement reste invisible pour l'utilisateur tant qu'il ne vide pas
    # son cache. On l'exclut explicitement du cache, contrairement aux bundles eux-mêmes
    # (main.<hash>.js) qui peuvent rester en cache long puisque leur nom change à chaque build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routing SPA Angular : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
