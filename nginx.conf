server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le fichier de config runtime ne doit jamais être mis en cache : il peut
    # être remplacé (volume monté) sans rebuild de l'image.
    location /assets/config/ {
        add_header Cache-Control "no-cache";
    }

    # Routing SPA Angular : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
